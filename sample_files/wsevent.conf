[program:wsevent]
command=<virtualenv path>/bin/python <site repo path>/websocket/daemon.py
directory=<site repo path>
environment=WS_BIND_HOST="127.0.0.1",WS_GET_PORT="15100",WS_POST_PORT="15101",WS_HTTP_PORT="15102"
# Should create a dedicated user.
user=<username>
group=<username>
stopsignal=TERM
stdout_logfile=/tmp/wsevent.stdout.log
stderr_logfile=/tmp/wsevent.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
